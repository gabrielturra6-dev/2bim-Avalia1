<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desenho Assinado</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <h1>Desenho Assinado</h1>

  <div id="botao-google"></div>
  <p id="usuario"></p>

  <form id="form">
    <label for="numero">Número (1 a 100)</label>
    <input type="number" id="numero" min="1" max="100" required>
    <button type="submit">Gerar desenho</button>
  </form>

  <p id="erro" role="alert" style="color:#c00"></p>
  <div id="resultado"></div>
  <button id="baixar" type="button" hidden>Baixar SVG</button>

  <script src="script.js"></script>
</body>
</html>
